name: smart-radio-env
version: "1.0.0"
description: >
  A cognitive radio environment for Dynamic Spectrum Access (DSA).
  An AI agent acts as a secondary user that opportunistically transmits
  on unused RF channels (white spaces) without disrupting licensed
  Primary Users. Reward: Throughput − β·Collision − γ·Energy.
  Real-world application: next-gen wireless networks, 5G spectrum sharing.
author: ""
tags:
  - openenv
  - cognitive-radio
  - spectrum
  - telecom
  - dynamic-spectrum-access
  - rl
  - pytorch

tasks:
  - id: 1
    name: find_quiet_channel
    difficulty: easy
    max_steps: 100
    seed: 42
    description: >
      Identify and consistently use the least-occupied RF channel.
      Primary users are rare (p_on=5%). Score = 1 - collision_rate/0.5.
      Random agent expected ~0.15, optimal agent expected ~0.95.

  - id: 2
    name: maximize_throughput
    difficulty: medium
    max_steps: 200
    seed: 123
    description: >
      Maximize data throughput while keeping collisions below 15%.
      Primary users moderately active (p_on=20%).
      Random agent expected ~0.20, optimal agent expected ~0.80.

  - id: 3
    name: coexist_primary_users
    difficulty: hard
    max_steps: 300
    seed: 456
    description: >
      Adapt to bursty, correlated primary users. At step 150 the PU
      activity pattern inverts — the agent must detect and re-adapt.
      Nemotron 3 Super expected ~0.25-0.35, trained DQN expected ~0.55-0.70.

action_space:
  type: object
  fields:
    channel_id:
      type: integer
      range: [0, 7]
      description: "Which RF channel to transmit on (discrete)"
    tx_power_dbm:
      type: float
      range: [0.0, 30.0]
      description: "Transmit power in dBm (continuous)"

observation_space:
  type: object
  fields:
    channel_occupancy:
      type: array
      length: "n_channels × t_history"
      value_range: [0.0, 1.0]
      description: "Flattened spectrogram — occupancy probability per channel per time step"
    last_reward:
      type: float
      description: "R = Throughput − β·Collision − γ·Energy from last step"
    collision_count:
      type: integer
      description: "Cumulative Primary User collisions this episode"

reward_range: [-10.1, 5.0]
reward_formula: "R = Throughput - β * Collision - γ * Energy  (β=10.0, γ=0.1)"
